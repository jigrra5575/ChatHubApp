<div class="bigdiv  m-auto my-5 ">
  <div class=" d-flex h-100">
    <div class=" h-100 firstblock">
      <!-- <video id="bgvideo" src="w/marvel bg video.mp4" autoplay loop preload="metadata" muted poster="/pc3.jfif"></video>
      <img src="/19.jpg" alt="" height="100%" width="100%"> -->
    </div>
    <div class=" logincontex align-content-center">
      <div class="d-flex align-content-around justify-content-center mb-3 position-relative">
        <h1 class="chatHUB">Chat HUB</h1>
      </div>
      <div class="p-3   ">
        <form action="" class="form">
          <div class="form-group my-2">
            <label for="email" class="form-label">Email : </label>
            <input type="text" class="form-control  shadow-lg" name="email" #email aria-describedby="helpId"
              placeholder="Email">
          </div>
          <div class="form-group my-2">
            <label for="password" class="form-label">Password : </label>
            <input type="password" class="form-control shadow-lg" name="password" #password aria-describedby="helpId"
              placeholder="Password">
          </div>
          <div class="form-group my-3" >
            <div class="d-flex justify-content-around row">
              <div class="col-4 justify-content-end d-flex">
                <input type="button" value="CreateGroup" class="createBtn btn " (click)="CreateGroup()" />
              </div>
              <div class="col-4 justify-content-start d-flex">
                <input type="button" value="JoinGroup" class="JoinBtn btn" (click)="JoinGroup()" />
              </div>
            </div>
          </div>

          <div *ngIf="createfildvalue" class="form-group my-2">
            <label for="groupname" class="form-label">{{GroupTitle}}</label>
            <select class="form-select shadow-lg" name="groupname" #group>
              <option value="" disabled selected class="form-select" >--  Select a Group  --</option>

              @for (g of allGroups; track $index) {
                <option value="{{g.groupId}}" class="form-select" #groupname>{{g.groupName}}</option>
              }
            </select>
          </div>

          <div *ngIf="groupfildvalue" class="form-group my-2">
            <label for="groupname" class="form-label">{{GroupTitle}}</label>
            <input type="text" class="form-control shadow-lg" name="groupname" #newgroupname aria-describedby="helpId"
              placeholder="Groupname">
          </div>

          <div class="form-group text-center my-2">
            <input type="button" value="Login" class="btn btn-success w-100"
              (click)="onsubmit(email.value, password.value)" />
          </div>
          <div class="text-center">
            <a class="registerButton" (click)="register()">Sign Up? Or Register..!</a>
          </div>
          <div *ngIf="err.length > 0" class="text-danger text-center mt-2 errorBox">
            {{ err }}
          </div>
        </form>
      </div>
    </div>
  </div>
